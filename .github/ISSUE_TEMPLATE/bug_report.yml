name: Bug report
description: Report a reproducible problem in Annotouch
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve Annotouch. Search existing issues first, and do not include private or sensitive PDFs. Report security vulnerabilities through the private process in SECURITY.md.

  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the problem and what you expected instead.
      placeholder: I expected… Instead…
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Give the smallest reliable sequence that demonstrates the problem.
      placeholder: |
        1. Open…
        2. Press…
        3. Observe…
    validations:
      required: true

  - type: input
    id: browser
    attributes:
      label: Browser and version
      placeholder: Chrome 140, Firefox 142, Safari 19…
    validations:
      required: true

  - type: input
    id: operating-system
    attributes:
      label: Operating system
      placeholder: macOS 15, Windows 11, Ubuntu 24.04…
    validations:
      required: true

  - type: textarea
    id: document
    attributes:
      label: PDF characteristics
      description: Describe relevant traits such as page count, rotation, encryption, or file size. Share only a generated or redacted fixture you have the right to publish.

  - type: textarea
    id: evidence
    attributes:
      label: Additional context
      description: Add console output, screenshots, or a recording. Remove private data first.

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched for an existing issue.
          required: true
        - label: I removed personal, confidential, and security-sensitive information.
          required: true
