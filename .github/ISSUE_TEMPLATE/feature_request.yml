name: Feature request
description: Suggest an improvement to Annotouch
title: "[Feature]: "
labels:
  - feature
body:
  - type: markdown
    attributes:
      value: |
        Explain the user problem before proposing an implementation. Search existing issues first so related ideas can stay together.

  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the workflow, limitation, or unmet need.
    validations:
      required: true

  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: What should a user be able to do when this is complete?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Describe current workarounds or other approaches you considered.

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add mockups, examples, accessibility considerations, or related tools.

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched for an existing request.
          required: true
        - label: This request preserves Annotouch's local-first privacy model, or I clearly explained any privacy impact.
          required: true
